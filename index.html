<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Raleway:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>Bakki M Designs</title>
  </head>
  <body>
    <header>
      <a class="nav-bakki" href="/index.html">Bakki M Designs</a>
      <nav>
        <ul>
          <li><a class="nav-link" href="/earrings.html">Earrings</a></li>
          <li><a class="nav-link" href="/bracelets.html">Bracelets</a></li>
          <li><a class="nav-link" href="/necklaces.html">Necklaces</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="hero">
        <p class="eyebrow">Handmade one of a kind jewelry</p>
        <h1>Coming Soon!</h1>
      </section>

      <section class="contact">
        <div class="contact-card">
          <h2>Get in Touch</h2>
          <!-- <p class="contact-subtitle">
            Every piece is made by hand, one at a time. Let us know what caught your eye.
          </p> -->
          <form class="contact-form" id="contactForm">
            <div class="form-group">
              <label for="name">Name</label>
              <input
                type="text"
                id="name"
                name="name"
                placeholder="Your name"
                required
              />
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="your@email.com"
                required
              />
            </div>
            <div class="form-group">
              <label for="message">Message</label>
              <textarea
                id="message"
                name="message"
                rows="3"
                placeholder="Tell us which piece you're interested in..."
              ></textarea>
            </div>
            <button type="submit" class="contact-submit">Send Inquiry</button>
          </form>
        </div>
      </section>
    </main>

    <script>
      document
        .getElementById("contactForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const name = document.getElementById("name").value;
          const email = document.getElementById("email").value;
          const message = document.getElementById("message").value;
          const subject = encodeURIComponent("Product Inquiry from " + name);
          const body = encodeURIComponent(
            "Name: " + name + "\nEmail: " + email + "\n\nMessage:\n" + message,
          );
          window.location.href =
            "mailto:hello@bakkimdesigns.com?subject=" +
            subject +
            "&body=" +
            body;
        });
    </script>
  </body>
</html>
